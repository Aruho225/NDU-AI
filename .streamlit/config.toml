[server]
headless = true
address = "0.0.0.0"
port = 8501
enableCORS = true
enableXsrfProtection = true
maxUploadSize = 25

[browser]
gatherUsageStats = false
serverAddress = "localhost"

[client]
toolbarMode = "minimal"
showSidebarNavigation = false

[theme]
primaryColor = "#0c2340"
backgroundColor = "#f4f4f4"
secondaryBackgroundColor = "#ffffff"
textColor = "#0c2340"
font = "sans serif"

[theme.sidebar]
backgroundColor = "#0c2340"
secondaryBackgroundColor = "#0c2340"
textColor = "#d6e8ff"
primaryColor = "#e31837"
borderColor = "#e31837"
